appId: com.jasonlin.pebblestudio
productName: Pebble Studio
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
extraResources:
  - from: vendor/timeshim
    to: timeshim
    filter: ["timeshim.c", "timeshim-x86_64.so"]
  - from: vendor/timeshim-win
    to: timeshim-win
    filter: ["timeshim-win.dll", "launcher.exe", "probe.exe"]
  - from: vendor/pebble-sdk
    to: pebble-sdk
mac:
  icon: build/icon.icns
  target:
    - dir
  extraResources:
    - from: vendor/qemu-pebble-mac
      to: qemu-pebble-mac
    - from: vendor/pebble-py-mac
      to: pebble-py-mac
linux:
  icon: build/icon.png
  target:
    - AppImage
    - dir
  extraResources:
    - from: vendor/qemu-pebble-linux
      to: qemu-pebble-linux
    - from: vendor/pebble-py-linux
      to: pebble-py-linux
win:
  icon: build/icon.ico
  target:
    - dir
  artifactName: "Pebble Studio ${version}.${ext}"
  signAndEditExecutable: false
  sign: null
  extraResources:
    - from: vendor/qemu-pebble-win
      to: qemu-pebble-win
    - from: vendor/pebble-py
      to: pebble-py
